services:
  caddy:
    profiles: ["caddy"]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
    depends_on:
      - web
    profiles: ["nginx"]
